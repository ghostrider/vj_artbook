    title: SDF Raymarched Morphing Forms
    status: published
    pitch: Shapes defined as signed distance functions are rendered by sphere tracing, which allows smooth blends, repeats and twists impossible with meshes. Blend factor, domain repetition and camera path map to MIDI and BPM for an endlessly morphing 3D world in a single shader.
    sources:
