  - slug: caustic-light-patterns
    title: Caustic Light Patterns
    status: published
    pitch: The bright, shifting net of light that curved or rippled surfaces focus onto a floor, as at the bottom of a pool. A cheap procedural caustic shader with wave speed, scale and tint on knobs makes a calm, liquid, architectural layer for projection mapping.
    sources:
      - https://en.wikipedia.org/wiki/Caustic_(optics)
