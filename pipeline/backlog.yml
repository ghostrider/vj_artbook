    title: Gray-Scott Reaction-Diffusion
    status: published
    pitch: Two virtual chemicals diffuse and react on a grid and grow spots, stripes and coral-like labyrinths. Feed and kill rates map to knobs, and audio can inject chemical at the beat, so the organic texture mutates between regimes on a club screen.
    sources:
      - https://karlsims.com/rd.html
    tags: [biology, simulation, shader, organic]
