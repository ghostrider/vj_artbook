    title: Fischinger Visual Music
    status: published
    pitch: Oskar Fischinger animated abstract shapes in strict sync with music, a direct ancestor of VJing. Recreate his language of pulsing circles, bars and layered forms as a rhythm-driven shape sequencer triggered from MIDI notes.
    sources:
      - https://en.wikipedia.org/wiki/Oskar_Fischinger
    tags: [art-history, visual-music, shapes, sync]
